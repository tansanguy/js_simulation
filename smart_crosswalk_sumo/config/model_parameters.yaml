vehicle_arrival_distribution:
  value: poisson
  unit: categorical
  source_type: assumption
  source_note: "기본 차량 도착분포는 포아송 가정. 관측 교통량 입력이 있으면 보정값 우선."
  fallback: true

pedestrian_arrival_distribution:
  value: exponential
  unit: categorical
  source_type: assumption
  source_note: "보행자 도착은 지수분포 간격 가정. 현장 계수기 자료가 있으면 대체."
  fallback: true

